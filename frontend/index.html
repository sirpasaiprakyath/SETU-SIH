<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/SETU_LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SETU - Multimodal Predictive Intelligence for Personnel Wellness</title>
    <meta name="description" content="SETU (सेतु) — Multimodal predictive intelligence platform for personnel wellness and proactive stress prevention. Developed by Team Guardian Minds." />
    
    <!-- PWA & Mobile App Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B132B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SETU Saathi" />
    
    <!-- Google Fonts: Noto Sans and Noto Sans Devanagari (GIGW / Indian Government Standard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAFBFD] text-[#1F2937] antialiased selection:bg-[#0070C0] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[SETU] ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.log('[SETU] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
